<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>钉笺 · 网页视觉原型</title>
  <meta name="description" content="钉笺日历、日程、待办和灵感排期网页视觉原型" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232478ff'/%3E%3Cpath d='M21 17h22v7l-5 5v10l5 5H21l5-5V29l-5-5z' fill='white'/%3E%3C/svg%3E" />
  <style>
    :root{
      --blue:#2478ff;--blue-2:#0d6efd;--blue-soft:#eef5ff;--blue-line:#dce8f8;
      --ink:#111827;--muted:#7c8799;--line:#e6ebf2;--panel:#fff;--canvas:#edf3fa;
      --page-bg:linear-gradient(145deg,#dae8f8 0%,#f8fbff 43%,#dceafb 100%);--shell-bg:rgba(255,255,255,.96);--topbar-bg:rgba(255,255,255,.72);--pane-bg:rgba(255,255,255,.88);--event-bg:#f3f7fc;--input-bg:#fbfcfe;--background-wash:.206;--background-pane:.377;--background-blur:1.4px;
      --red:#ff4556;--green:#1daf78;--orange:#ff8a25;--orange-soft:#fff7ed;
      --shadow:0 22px 65px rgba(38,68,111,.18),0 2px 8px rgba(38,68,111,.08);
      --radius:18px;
    }
    *{box-sizing:border-box} html,body{height:100%;margin:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--page-bg);font-size:15px;overflow:hidden}
    button,input,textarea,select{font:inherit;color:inherit} button{cursor:pointer}
    .stage{height:100%;padding:18px;position:relative;overflow:hidden}
    .workspace{position:absolute;left:50%;top:50%;width:880px;height:620px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:10px;transform:translate(-50%,-50%);transform-origin:center center;transition:width .24s ease,height .24s ease,grid-template-columns .24s ease}
    .workspace.drawer-closed{grid-template-columns:minmax(0,1fr) 0;gap:0}
    .app,.drawer{background-color:var(--shell-bg);border:1px solid rgba(205,219,237,.88);box-shadow:var(--shadow);overflow:hidden}
    .app{border-radius:var(--radius);display:grid;grid-template-rows:58px minmax(0,1fr);position:relative;min-width:0}
    .topbar{display:grid;grid-template-columns:minmax(140px,1fr) auto minmax(140px,1fr);align-items:center;border-bottom:1px solid var(--line);padding:0 16px 0 14px;cursor:grab;user-select:none;background:var(--topbar-bg)}
    .brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:760}.brand-mark{color:var(--blue);display:grid;place-items:center;width:25px;height:25px}
    .traffic{display:flex;gap:8px;margin-right:12px}.traffic i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.traffic i:nth-child(2){background:#febc2e}.traffic i:nth-child(3){background:#28c840}
    .brand-left{display:flex;align-items:center}
    .view-tabs{justify-self:center;width:220px;background:#f1f3f7;border-radius:9px;padding:3px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
    .view-tabs button,.drawer-tabs button{border:0;background:transparent;border-radius:7px;padding:7px 12px;color:#485365;font-weight:560}
    .view-tabs button.active,.drawer-tabs button.active{background:white;color:var(--ink);box-shadow:0 1px 4px rgba(25,45,80,.16)}
    .top-actions{justify-self:end;display:flex;align-items:center;gap:10px;color:var(--blue);font-weight:650}.icon-btn{border:0;background:transparent;color:inherit;padding:6px;display:grid;place-items:center;border-radius:8px}.icon-btn:hover{background:var(--blue-soft)}
    .timer{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums}.divider{width:1px;height:26px;background:var(--line)}
    .content{min-height:0;display:grid;grid-template-columns:28% 42% 30%;transition:grid-template-columns .25s ease}
    .pane{min-width:0;min-height:0;position:relative;background:var(--pane-bg)}.pane+.pane{border-left:1px solid var(--line)}
    .calendar-pane{padding:20px 14px 14px;display:flex;flex-direction:column}
    .calendar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 16px}.month{font-size:17px;font-weight:760;white-space:nowrap}.month-nav{display:flex;align-items:center;gap:4px}.mini{height:28px;min-width:27px;padding:0 7px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px}.weekday,.day{height:34px;display:grid;place-items:center;position:relative}.weekday{height:27px;color:#6f7a8c;font-size:12px;font-weight:600}.day{border:0;background:transparent;border-radius:10px;font-size:13px;font-weight:570}.day:hover{background:#f4f7fb}.day.selected{background:#2f7df5;color:#fff;box-shadow:0 7px 18px rgba(36,120,255,.25)}.day.other{color:#c3cad4}.day .marks{position:absolute;bottom:1px;display:flex;gap:3px}.dot{width:5px;height:5px;border-radius:50%;display:inline-block}.red{background:var(--red)}.green{background:var(--green)}.orange{background:var(--orange)}
    .legend{display:flex;justify-content:space-between;padding:14px 6px 16px;color:#586476;font-size:12px;border-bottom:1px solid var(--line)}.legend span{display:flex;align-items:center;gap:7px}
    .motto{margin-top:auto;color:#9ba5b4;font-size:11px;padding:10px 5px 2px}
    .schedule-pane{display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:20px 16px 14px}.day-title{font-size:21px;font-weight:760;margin:0 0 14px}
    .schedule-scroll{min-height:0;overflow:auto;padding:8px 4px 0 0}.pinned-topic{border:1px solid #ffd7ad;background:linear-gradient(90deg,#fff8ef,#fffaf5);border-radius:11px;padding:13px 16px;margin-bottom:16px}.eyebrow{display:flex;justify-content:space-between;color:var(--orange);font-size:12px;font-weight:700;margin-bottom:8px}.topic-title{font-size:17px;font-weight:700}.chips{display:flex;gap:7px;margin-top:9px}.chip{font-size:11px;color:#7c8799;background:#f3f5f8;padding:4px 7px;border-radius:6px}
    .timeline{position:relative;height:560px;margin-left:54px}.timeline:before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:#d9e4f2}.timeline-gridline{position:absolute;left:0;right:0;border-top:1px solid var(--line)}.timeline-gridline:before{content:"";position:absolute;left:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:#d3dfef}.timeline-label{position:absolute;right:calc(100% + 12px);top:-8px;width:42px;text-align:right;color:#8390a4;font-size:12px;font-variant-numeric:tabular-nums}.event-card{position:absolute;left:12px;right:0;background:var(--event-bg);border:1px solid #e4edf9;border-left:3px solid var(--blue);border-radius:8px;padding:7px 10px;min-height:36px;display:flex;align-items:center;gap:9px;overflow:hidden;box-shadow:0 1px 0 rgba(36,120,255,.04)}.event-card.concurrent{padding:6px 7px;gap:6px}.event-card.concurrent .event-icon{width:22px;height:22px;border-radius:7px}.event-card.concurrent .event-main{font-size:12px}.event-card.concurrent .event-meta{font-size:10px}.event-card.dense .event-icon{display:none}.event-icon{width:27px;height:27px;display:grid;place-items:center;background:var(--blue-soft);border-radius:8px;color:var(--blue);flex:none}.event-main{font-weight:660;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-meta{margin-top:2px;color:#7d889a;font-size:11px;white-space:nowrap}.event-more{margin-left:auto;color:#687588;flex:none}
    .composer{padding-top:12px}.time-controls{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}.time-controls select{appearance:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 24px 7px 8px;background-image:linear-gradient(45deg,transparent 50%,#738095 50%),linear-gradient(135deg,#738095 50%,transparent 50%);background-position:calc(100% - 12px) 52%,calc(100% - 8px) 52%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}.input-row{display:grid;grid-template-columns:1fr 38px;gap:8px}.input-row input,.todo-add textarea,.idea-title,.idea-notes,.idea-tags{border:1px solid var(--line);background:var(--input-bg);border-radius:9px;outline:none}.input-row input{height:38px;padding:0 12px}.input-row input:focus,.todo-add textarea:focus,.idea-title:focus,.idea-notes:focus,.idea-tags:focus{border-color:#80b1ff;box-shadow:0 0 0 3px rgba(36,120,255,.10)}.add-round{border:0;border-radius:10px;background:var(--blue);color:white;font-size:22px}
    .todo-pane{display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:20px 15px 14px}.todo-head{display:flex;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}.todo-head h2{font-size:20px;margin:0}.count{margin-left:8px;background:#f0f2f5;color:#778295;border-radius:999px;padding:2px 8px;font-size:12px}.sort{margin-left:auto;border:0;background:transparent;color:#788496}
    .todo-list{overflow:auto}.todo-item{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:65px;border-bottom:1px solid var(--line)}.todo-check{appearance:none;width:20px;height:20px;border:1.5px solid #9facbd;border-radius:5px;margin:0;display:grid;place-items:center}.todo-check:checked{background:var(--blue);border-color:var(--blue)}.todo-check:checked:after{content:"✓";color:#fff;font-size:14px}.todo-text{font-weight:570;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.todo-text.done{text-decoration:line-through;color:#98a1ae}.priority{font-size:10px;border-radius:6px;padding:4px 7px}.priority.high{color:#ef5361;background:#fff0f2}.priority.mid{color:#e78a19;background:#fff5e9}.priority.low{color:#279767;background:#edf9f3}.due{display:none}.todo-actions{position:absolute;right:0;display:flex;gap:3px;background:#fff;opacity:0;transition:.15s}.todo-item:hover .todo-actions{opacity:1}.todo-actions button{border:0;background:transparent;color:var(--blue);padding:5px}
    .todo-add{display:grid;grid-template-columns:1fr 72px;gap:10px;align-items:end;padding-top:14px}.todo-add textarea{resize:none;height:58px;padding:10px 12px}.primary{border:0;background:var(--blue);color:white;border-radius:9px;font-weight:650;height:42px;padding:0 16px;box-shadow:0 8px 18px rgba(36,120,255,.18)}.primary:hover{background:#126aec}
    .drawer{border-radius:var(--radius);display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr);padding:18px 14px 14px;transition:opacity .2s ease,transform .28s ease}.drawer.closed{opacity:0;transform:translateX(16px);pointer-events:none}.drawer-head{display:flex;align-items:center;gap:9px;padding:0 2px 12px}.drawer-head h2{font-size:18px;margin:0}.drawer-head button{margin-left:auto}.drawer-tabs{background:#f1f3f7;border-radius:9px;padding:3px;display:grid;grid-template-columns:1fr 1fr;margin-bottom:12px}.drawer-tabs button{padding:8px 6px;font-size:13px}.drawer-tabs button.active{color:var(--blue);box-shadow:none;border-bottom:2px solid var(--blue);border-radius:7px 7px 2px 2px}
    .capture{display:grid;gap:8px}.field-label{font-size:12px;color:#657185;font-weight:650;margin-bottom:-3px}.field-label em{font-style:normal;color:#a1a9b6;font-weight:500}.idea-title,.idea-tags{height:38px;padding:0 11px}.idea-notes{height:72px;padding:9px 11px;resize:none;line-height:1.5}.field-hint{font-size:11px;color:#9aa4b3;margin-top:-4px}.save-idea{height:40px;width:100%}.recent-head{display:flex;align-items:center;margin:14px 0 9px;font-weight:720}.recent-head small{margin-left:6px;background:#eff2f6;color:#818b9b;border-radius:999px;padding:2px 6px}.recent-head button{margin-left:auto;border:0;background:transparent;color:#8791a0;font-size:12px}.idea-list{overflow:auto;display:grid;align-content:start;gap:8px}.idea-card{border:1px solid var(--line);border-radius:10px;padding:11px 10px;background:#fff;cursor:grab}.idea-card.scheduled{background:#f2f4f7;color:#8b94a2}.idea-card-title{font-size:13px;font-weight:650;display:flex;gap:7px}.idea-card-title:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange);margin-top:5px;flex:none}.idea-card-note{font-size:11px;color:#697587;margin:6px 0 7px;line-height:1.45}.idea-tags-row{display:flex;flex-wrap:wrap;gap:4px}.idea-tag{font-size:10px;color:#768397;background:#f2f5f8;border-radius:5px;padding:3px 5px}.idea-status{font-size:10px;color:#9aa4b3;margin-top:7px}.drawer-tab{position:absolute;right:0;top:50%;transform:translateY(-50%);width:5px;height:34px;border:0;border-radius:4px 0 0 4px;background:var(--blue);color:transparent;padding:0;box-shadow:none;display:none}.drawer-tab:hover,.drawer-tab:focus-visible{width:8px;background:#0d6efd;outline:2px solid rgba(36,120,255,.18);outline-offset:2px}.workspace.drawer-closed .drawer-tab{display:block}
    .resize-handle{position:absolute;right:5px;bottom:5px;width:18px;height:18px;border:0;background:transparent;border-right:2px solid #aeb9c8;border-bottom:2px solid #aeb9c8;border-radius:0 0 6px 0;cursor:nwse-resize;opacity:.75}
    .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:#162033;color:#fff;border-radius:10px;padding:11px 16px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    .hidden{display:none!important}
    .workspace.compact .traffic{display:none}.workspace.compact .topbar{grid-template-columns:72px 1fr auto;padding-left:12px}.workspace.compact .brand{font-size:18px}.workspace.compact .view-tabs{width:168px}.workspace.compact .divider{display:none}.workspace.compact .top-actions{gap:2px}.workspace.compact .timer{font-size:12px;padding-inline:3px}.workspace.compact .icon-btn{padding:5px}
    .native body{background:transparent}.native .stage{padding:0}.native .workspace{display:block;left:0;top:0;width:100%!important;height:100%!important;transform:none!important;zoom:1!important}.native .app{position:absolute;inset:0;border-radius:18px;transition:right .2s ease}.native .workspace:not(.drawer-closed) .app{right:260px}.native .drawer{position:absolute;right:0;top:0;bottom:0;width:250px;border-radius:18px}.native .workspace.drawer-closed .drawer{display:none}.native .traffic{display:flex}.native.edge-collapsed body:after{content:"";position:fixed;left:0;top:50%;width:8px;height:46px;transform:translateY(-50%);background:var(--blue);border-radius:0 7px 7px 0;z-index:999}
    .event-actions{position:absolute;right:5px;top:5px;display:flex;gap:2px;opacity:0;transition:.15s;background:rgba(255,255,255,.94);border-radius:6px}.event-card:hover .event-actions{opacity:1}.event-actions button,.idea-actions button{border:0;background:transparent;color:#6b7890;padding:4px;border-radius:5px}.event-actions button:hover,.idea-actions button:hover{background:#e6eef9;color:var(--blue)}
    .idea-card{position:relative}.idea-actions{position:absolute;right:7px;top:7px;display:flex;opacity:0}.idea-card:hover .idea-actions{opacity:1}.idea-card-title{padding-right:50px}
    .settings{position:absolute;right:14px;top:64px;width:300px;max-width:calc(100% - 28px);background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 48px rgba(30,55,90,.22);padding:14px;z-index:30}.settings h3{margin:0 0 12px;font-size:16px}.settings-row{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12px}.settings-row strong{min-width:56px}.settings-row button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 8px}.settings-row button.active{border-color:var(--blue);color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 10%,transparent)}.settings-row .primary{border:0}.settings input[type=checkbox]{accent-color:var(--blue)}.settings input[type=range]{appearance:none;flex:1;height:4px;border-radius:999px;background:linear-gradient(90deg,var(--blue) var(--range-progress,82%),#e4e9f1 var(--range-progress,82%));outline:none}.settings input[type=range]::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid var(--blue);box-shadow:0 2px 6px rgba(32,61,105,.2)}.range-value{width:34px;text-align:right;color:var(--blue);font-variant-numeric:tabular-nums;font-weight:650}.settings-status{margin:6px 0 0 63px;color:#8792a3;font-size:11px;line-height:1.35}.settings-status.ok{color:#16875c}.settings-status.error{color:#d9485f}.focus-settings{display:grid;grid-template-columns:1fr 82px;gap:7px;margin-top:9px}.focus-settings input,.focus-settings select{height:34px;border:1px solid var(--line);border-radius:7px;background:var(--input-bg);padding:0 8px;min-width:0}.focus-buttons{display:flex;gap:7px;margin-top:7px}.focus-buttons button{flex:1}
    body.has-background{background-image:var(--custom-background);background-size:cover;background-position:center}.has-background .app,.has-background .drawer{background-image:linear-gradient(rgba(255,255,255,var(--background-wash)),rgba(255,255,255,var(--background-wash))),var(--custom-background);background-size:cover;background-position:center}.has-background .topbar{background:rgba(255,255,255,calc(var(--background-pane) + .12));backdrop-filter:blur(var(--background-blur))}.has-background .pane{background:rgba(255,255,255,var(--background-pane));backdrop-filter:blur(var(--background-blur))}.has-background .event-card,.has-background .pinned-topic{background-color:rgba(247,250,255,.88)}.has-background .todo-actions{background:rgba(255,255,255,.9)}
  </style>
</head>
<body>
  <main class="stage">
    <div class="workspace drawer-closed" id="workspace">
      <section class="app" aria-label="钉笺工作台">
        <header class="topbar">
          <div class="brand-left"><span class="traffic" aria-hidden="true"><i></i><i></i><i></i></span><div class="brand"><span class="brand-mark">✿</span>钉笺</div></div>
          <nav class="view-tabs" aria-label="视图切换"><button data-view="all">全部</button><button data-view="schedule">日程</button><button class="active" data-view="todo">待办</button></nav>
          <div class="top-actions"><button class="timer" id="focusTimer" aria-label="开始番茄计时">◴ <span>25:00</span></button><button class="icon-btn utility" id="editButton" aria-label="打开设置" title="背景、Apple 日历与数据设置">⚙︎</button><span class="divider"></span><button class="icon-btn" id="collapseButton" title="收进屏幕右侧">−</button><button class="icon-btn" id="quitButton" title="退出钉笺">×</button></div>
        </header>
        <div class="content" id="content">
          <aside class="pane calendar-pane hidden" data-pane="calendar">
            <div class="calendar-head"><div class="month">2025年 4月</div><div class="month-nav"><button class="mini">‹</button><button class="mini">今天</button><button class="mini">›</button></div></div>
            <div class="calendar" id="calendar"></div>
            <div class="legend"><span><i class="dot red"></i>待办 12</span><span><i class="dot green"></i>日程 8</span><span><i class="dot orange"></i>选题 4</span></div>
            <div class="motto">轻轻记下，做完就走。</div>
          </aside>
          <section class="pane schedule-pane hidden" data-pane="schedule">
            <h1 class="day-title">4月16日 <span style="color:#697587;font-size:16px;font-weight:500">周三</span></h1>
            <div class="schedule-scroll">
              <div id="pinnedTopics"></div>
              <div class="timeline" id="timeline"></div>
            </div>
            <form class="composer" id="scheduleForm"><div class="time-controls"><span>开始</span><select id="startTime" aria-label="开始时间"></select><span>结束</span><select id="endTime" aria-label="结束时间"></select></div><div class="input-row"><input id="scheduleTitle" placeholder="这段时间做什么？" /><button class="add-round" aria-label="添加日程">＋</button></div></form>
          </section>
          <section class="pane todo-pane" data-pane="todo">
            <div class="todo-head"><h2>待办</h2><span class="count" id="todoCount">5</span><button class="sort">按优先级⌄</button></div><div class="todo-list" id="todoList"></div>
            <form class="todo-add" id="todoForm"><textarea id="todoInput" placeholder="添加待办…（可粘贴多行 Markdown）"></textarea><button class="primary">添加</button></form>
          </section>
        </div>
        <button class="resize-handle" id="resizeHandle" aria-label="拖动调整便签大小" title="拖动调整大小"></button>
      </section>
      <aside class="drawer closed" id="drawer" aria-label="灵感抽屉">
        <div class="drawer-head"><span style="color:var(--blue)">♧</span><h2>灵感</h2><button class="icon-btn" id="closeDrawer">×</button></div>
        <div class="drawer-tabs"><button class="active">快速记录</button><button>我的选题</button></div>
        <form class="capture" id="ideaForm">
          <label class="field-label" for="ideaTitle">选题标题</label><input class="idea-title" id="ideaTitle" placeholder="例如：普通人如何搭建个人知识库？" />
          <label class="field-label" for="ideaNotes">补充想法 <em>可选</em></label><textarea class="idea-notes" id="ideaNotes" placeholder="记下切入角度、案例或一句关键想法"></textarea>
          <label class="field-label" for="ideaTags">标签 <em>可选</em></label><input class="idea-tags" id="ideaTags" placeholder="效率, 工具, 个人成长" /><div class="field-hint">用空格、逗号或 # 分隔</div>
          <button class="primary save-idea">保存灵感　⌘ S</button>
        </form>
        <div class="recent-head">近期灵感 <small id="ideaCount">4</small><button>最新⌄</button></div><div class="idea-list" id="ideaList"></div>
      </aside>
      <button class="drawer-tab" id="drawerTab" aria-label="展开灵感抽屉"></button>

  </main>
  <div class="toast" id="toast"></div>
  <script>
    const native=!!window.webkit?.messageHandlers?.pinnedNote;if(native)document.documentElement.classList.add('native');
    const post=payload=>native&&window.webkit.messageHandlers.pinnedNote.postMessage(payload);
    const escapeHTML=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const uuid=()=>crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`;
    const pad=n=>String(n).padStart(2,'0'),dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const parseDay=k=>{const [y,m,d]=String(k).split('-').map(Number);return new Date(y,m-1,d)};
    const timeToMinutes=t=>{const [h,m]=String(t||'00:00').split(':').map(Number);return h*60+m};
    const DAY_START=7*60,DAY_END=23*60,PX_PER_HOUR=72;
    let state={schemaVersion:3,tasks:[],events:[],ideas:[],taskTimer:{mode:'stopwatch',startedAt:0,limit:0},focus:{mode:'countdown',title:'',duration:1500,elapsed:0,startedAt:0,running:false}};
    let selectedDate=new Date(),monthCursor=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1),currentView='all',drawerOpen=false,calendarSync=false,tickTimer;
    const workspace=document.querySelector('#workspace'),drawer=document.querySelector('#drawer'),calendar=document.querySelector('#calendar');
    function save(){post({type:'save',state})}
    function showToast(text){const t=document.querySelector('#toast');t.textContent=text;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),1600)}
    function dayLabel(key){const d=parseDay(key),today=new Date(),tomorrow=new Date(today.getFullYear(),today.getMonth(),today.getDate()+1);return key===dateKey(today)?'今天':key===dateKey(tomorrow)?'明天':`${d.getMonth()+1}月${d.getDate()}日`}
    function selectedTitle(){return `${selectedDate.getMonth()+1}月${selectedDate.getDate()}日 <span style="color:#697587;font-size:16px;font-weight:500">周${'日一二三四五六'[selectedDate.getDay()]}</span>`}
    function renderCalendar(){calendar.innerHTML='';['日','一','二','三','四','五','六'].forEach(x=>calendar.insertAdjacentHTML('beforeend',`<div class="weekday">${x}</div>`));document.querySelector('.month').textContent=`${monthCursor.getFullYear()}年 ${monthCursor.getMonth()+1}月`;const first=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=dateKey(d),other=d.getMonth()!==monthCursor.getMonth(),button=document.createElement('button');button.className=`day ${other?'other':''} ${key===dateKey(selectedDate)?'selected':''}`;button.textContent=d.getDate();const dayTasks=state.tasks.filter(x=>x.day===key),dayEvents=state.events.filter(x=>x.day===key),dayIdeas=state.ideas.filter(x=>x.day===key),marks=[];if(dayTasks.length)marks.push(dayTasks.every(x=>x.done)?'green':'red');else if(dayEvents.length)marks.push('green');if(dayIdeas.length)marks.push('orange');if(marks.length)button.insertAdjacentHTML('beforeend',`<span class="marks">${marks.map(c=>`<i class="dot ${c}"></i>`).join('')}</span>`);button.onclick=()=>{selectedDate=d;renderAll()};button.ondragover=e=>e.preventDefault();button.ondrop=e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain'),idea=state.ideas.find(x=>x.id===id);if(!idea)return;idea.day=key;selectedDate=d;save();renderAll();showToast(`已排期到 ${d.getMonth()+1}月${d.getDate()}日`)};calendar.appendChild(button)}const pending=state.tasks.filter(x=>!x.done).length,events=state.events.length,ideas=state.ideas.filter(x=>x.day).length;document.querySelector('.legend').innerHTML=`<span><i class="dot red"></i>待办 ${pending}</span><span><i class="dot green"></i>日程 ${events}</span><span><i class="dot orange"></i>选题 ${ideas}</span>`}
    function layoutEvents(events){const sorted=[...events].map(x=>({...x,_start:timeToMinutes(x.time),_end:Math.max(timeToMinutes(x.time)+15,timeToMinutes(x.endTime))})).sort((a,b)=>a._start-b._start||a._end-b._end),groups=[];let group=[],groupEnd=-1;for(const event of sorted){if(group.length&&event._start>=groupEnd){groups.push(group);group=[];groupEnd=-1}group.push(event);groupEnd=Math.max(groupEnd,event._end)}if(group.length)groups.push(group);return groups.flatMap(items=>{const columnEnds=[];for(const event of items){let column=columnEnds.findIndex(end=>end<=event._start);if(column<0)column=columnEnds.length;columnEnds[column]=event._end;event._column=column}const columns=columnEnds.length;items.forEach(event=>event._columns=columns);return items})}
    function renderTimeline(){document.querySelector('.day-title').innerHTML=selectedTitle();const key=dateKey(selectedDate),pinned=state.ideas.filter(x=>x.day===key),pinnedEl=document.querySelector('#pinnedTopics');pinnedEl.innerHTML=pinned.map(x=>`<article class="pinned-topic"><div class="eyebrow"><span>●　置顶选题</span><button class="icon-btn" data-unschedule="${x.id}" style="color:var(--orange);padding:0">撤销</button></div><div class="topic-title">${escapeHTML(x.title)}</div><div class="chips">${(x.tags||[]).map(t=>`<span class="chip">#${escapeHTML(t)}</span>`).join('')}</div></article>`).join('');pinnedEl.querySelectorAll('[data-unschedule]').forEach(b=>b.onclick=()=>{delete state.ideas.find(x=>x.id===b.dataset.unschedule).day;save();renderAll()});const el=document.querySelector('#timeline');el.innerHTML='';el.style.height=`${(DAY_END-DAY_START)/60*PX_PER_HOUR}px`;for(let mins=DAY_START;mins<=DAY_END;mins+=60){const top=(mins-DAY_START)/60*PX_PER_HOUR;el.insertAdjacentHTML('beforeend',`<div class="timeline-gridline" style="top:${top}px"><span class="timeline-label">${pad(Math.floor(mins/60))}:00</span></div>`)}layoutEvents(state.events.filter(x=>x.day===key)).forEach(x=>{const start=x._start,end=x._end,top=(Math.max(DAY_START,start)-DAY_START)/60*PX_PER_HOUR,height=Math.max(36,(Math.min(DAY_END,end)-Math.max(DAY_START,start))/60*PX_PER_HOUR-4),left=x._column===0?'12px':`calc(${x._column/x._columns*100}% + 3px)`,remaining=x._columns-x._column-1,right=remaining===0?'0px':`calc(${remaining/x._columns*100}% + 3px)`,classes=`event-card${x._columns>1?' concurrent':''}${x._columns>2?' dense':''}`;el.insertAdjacentHTML('beforeend',`<div class="${classes}" style="top:${top+2}px;height:${height}px;left:${left};right:${right};z-index:${x._column+1}"><span class="event-icon">${x.done?'✓':'●'}</span><div style="min-width:0"><div class="event-main">${escapeHTML(x.title)}</div><div class="event-meta">${escapeHTML(x.time)} – ${escapeHTML(x.endTime||'')}</div></div><div class="event-actions"><button title="完成" data-event-done="${x.id}">✓</button><button title="转为待办" data-event-task="${x.id}">↗</button><button title="删除" data-event-delete="${x.id}">×</button></div></div>`)});el.querySelectorAll('[data-event-done]').forEach(b=>b.onclick=()=>{const x=state.events.find(v=>v.id===b.dataset.eventDone);x.done=!x.done;save();renderAll()});el.querySelectorAll('[data-event-task]').forEach(b=>b.onclick=()=>{const x=state.events.find(v=>v.id===b.dataset.eventTask);state.tasks.push({id:uuid(),title:x.title,done:false,elapsed:0,createdAt:Date.now()/1000,day:x.day,priority:'low'});save();renderAll();showToast('已加入待办')});el.querySelectorAll('[data-event-delete]').forEach(b=>b.onclick=()=>{state.events=state.events.filter(x=>x.id!==b.dataset.eventDelete);save();renderAll()})}
    function taskElapsed(task){let value=Number(task.elapsed||0);if(state.taskTimer.activeTaskID===task.id&&state.taskTimer.startedAt)value+=Date.now()/1000-state.taskTimer.startedAt;return Math.max(0,value)}
    function formatDuration(seconds){seconds=Math.floor(seconds);return `${pad(Math.floor(seconds/60))}:${pad(seconds%60)}`}
    function renderTodos(){const el=document.querySelector('#todoList');el.innerHTML='';const order={high:0,mid:1,low:2};[...state.tasks].sort((a,b)=>(order[a.priority]??2)-(order[b.priority]??2)||Number(a.done)-Number(b.done)).forEach(x=>{const priority=x.priority||'low',label=priority==='high'?'高':priority==='mid'?'中':'低',running=state.taskTimer.activeTaskID===x.id;el.insertAdjacentHTML('beforeend',`<div class="todo-item"><input class="todo-check" type="checkbox" data-task-check="${x.id}" ${x.done?'checked':''}/><span class="todo-text ${x.done?'done':''}">${escapeHTML(x.title)}</span><span class="priority ${priority}">${label}</span><span class="due">${dayLabel(x.day||dateKey(new Date()))}</span><div class="todo-actions"><button data-task-timer="${x.id}" title="${running?'暂停':'开始'}计时">${running?'Ⅱ':'▶'} <small>${formatDuration(taskElapsed(x))}</small></button><button data-task-delete="${x.id}" title="删除">×</button></div></div>`)});document.querySelector('#todoCount').textContent=state.tasks.filter(x=>!x.done).length;el.querySelectorAll('[data-task-check]').forEach(b=>b.onchange=()=>{state.tasks.find(x=>x.id===b.dataset.taskCheck).done=b.checked;save();renderAll()});el.querySelectorAll('[data-task-delete]').forEach(b=>b.onclick=()=>{stopTaskTimer(false);state.tasks=state.tasks.filter(x=>x.id!==b.dataset.taskDelete);save();renderAll()});el.querySelectorAll('[data-task-timer]').forEach(b=>b.onclick=()=>toggleTaskTimer(b.dataset.taskTimer))}
    function stopTaskTimer(writeCalendar=true){const timer=state.taskTimer||{},task=state.tasks.find(x=>x.id===timer.activeTaskID);if(!task||!timer.startedAt)return;const end=Date.now()/1000,delta=Math.max(0,end-timer.startedAt);task.elapsed=Number(task.elapsed||0)+delta;if(writeCalendar&&calendarSync&&delta>=1)post({type:'calendarEvent',title:task.title,start:timer.startedAt,end,source:'待办计时'});delete timer.activeTaskID;timer.startedAt=0}
    function toggleTaskTimer(id){if(state.taskTimer.activeTaskID===id)stopTaskTimer();else{stopTaskTimer();state.taskTimer.activeTaskID=id;state.taskTimer.startedAt=Date.now()/1000}save();renderTodos()}
    function renderIdeas(){const el=document.querySelector('#ideaList');el.innerHTML='';state.ideas.forEach(x=>{const scheduled=!!x.day,tags=(x.tags||[]).map(t=>`<span class="idea-tag">#${escapeHTML(t)}</span>`).join('');el.insertAdjacentHTML('beforeend',`<article class="idea-card ${scheduled?'scheduled':''}" id="idea-${x.id}" draggable="${!scheduled}" data-id="${x.id}"><div class="idea-actions"><button data-idea-task="${x.id}" title="转待办">↗</button><button data-idea-delete="${x.id}" title="删除">×</button></div><div class="idea-card-title">${escapeHTML(x.title)}</div>${x.notes?`<div class="idea-card-note">${escapeHTML(x.notes)}</div>`:''}<div class="idea-tags-row">${tags}</div><div class="idea-status">${scheduled?`已排期 · ${dayLabel(x.day)}`:'未排期 · 拖到日历'}</div></article>`);const card=document.querySelector(`#idea-${CSS.escape(x.id)}`);card.ondragstart=e=>e.dataTransfer.setData('text/plain',x.id)});document.querySelector('#ideaCount').textContent=state.ideas.length;el.querySelectorAll('[data-idea-delete]').forEach(b=>b.onclick=()=>{state.ideas=state.ideas.filter(x=>x.id!==b.dataset.ideaDelete);save();renderAll()});el.querySelectorAll('[data-idea-task]').forEach(b=>b.onclick=()=>{const x=state.ideas.find(v=>v.id===b.dataset.ideaTask);state.tasks.push({id:uuid(),title:x.title,done:false,elapsed:0,createdAt:Date.now()/1000,day:x.day||dateKey(new Date()),priority:'low'});save();renderAll();showToast('已加入待办')})}
    function renderFocus(){const f=state.focus||{},elapsed=Number(f.elapsed||0)+(f.running&&f.startedAt?Date.now()/1000-f.startedAt:0),seconds=f.mode==='countup'?elapsed:Math.max(0,Number(f.duration||1500)-elapsed);document.querySelector('#focusTimer span').textContent=formatDuration(seconds);document.querySelector('#focusTimer').classList.toggle('running',!!f.running);if(f.mode==='countdown'&&f.running&&seconds<=0){const end=Date.now()/1000,start=f.startedAt;f.elapsed=Number(f.duration||1500);f.running=false;f.startedAt=0;if(calendarSync&&end>start)post({type:'calendarEvent',title:f.title||'番茄专注',start,end,source:'番茄专注'});save();showToast('本轮番茄完成')}}
    function renderAll(){renderCalendar();renderTimeline();renderTodos();renderIdeas();renderFocus()}
    function setView(view,notify=true){currentView=view;document.querySelectorAll('.view-tabs button').forEach(x=>x.classList.toggle('active',x.dataset.view===view));document.querySelectorAll('[data-pane]').forEach(p=>p.classList.toggle('hidden',view!=='all'&&p.dataset.pane!==view));document.querySelector('#content').style.gridTemplateColumns=view==='all'?'28% 42% 30%':'1fr';workspace.classList.toggle('compact',view!=='all');if(notify)post({type:'mode',mode:view})}
    function setDrawer(open,notify=true){drawerOpen=open;workspace.classList.toggle('drawer-closed',!open);drawer.classList.toggle('closed',!open);if(notify)post({type:'drawer',open})}
    function applyTheme(name='blue'){const themes={blue:{'--blue':'#2478ff','--blue-soft':'#eef5ff','--line':'#e6ebf2','--page-bg':'linear-gradient(145deg,#dae8f8 0%,#f8fbff 43%,#dceafb 100%)','--shell-bg':'rgba(255,255,255,.96)','--topbar-bg':'rgba(255,255,255,.72)','--pane-bg':'rgba(255,255,255,.88)','--event-bg':'#f3f7fc','--input-bg':'#fbfcfe'},sky:{'--blue':'#0891b2','--blue-soft':'#e6f9fd','--line':'#d8edf2','--page-bg':'linear-gradient(145deg,#d9f5f8 0%,#f8feff 46%,#dceff8 100%)','--shell-bg':'rgba(248,254,255,.97)','--topbar-bg':'rgba(239,252,255,.86)','--pane-bg':'rgba(247,253,255,.9)','--event-bg':'#eaf8fb','--input-bg':'#f5fcfd'},navy:{'--blue':'#596bc9','--blue-soft':'#eef0ff','--line':'#e1e4f2','--page-bg':'linear-gradient(145deg,#e2e6f7 0%,#fafbff 45%,#dde5f5 100%)','--shell-bg':'rgba(250,251,255,.97)','--topbar-bg':'rgba(242,244,253,.88)','--pane-bg':'rgba(249,250,255,.9)','--event-bg':'#eef0fa','--input-bg':'#f8f9fe'}},resolved=themes[name]?name:'blue',t=themes[resolved];Object.entries(t).forEach(([key,value])=>document.documentElement.style.setProperty(key,value));document.body.dataset.theme=resolved;document.querySelectorAll('[data-theme]').forEach(button=>button.classList.toggle('active',button.dataset.theme===resolved))}
    function setSettingsStatus(id,message,tone=''){const el=document.querySelector(`#${id}`);el.textContent=message;el.className=`settings-status ${tone}`.trim()}
    function applyBackgroundVisibility(value,persist=false){const visibility=Math.max(20,Math.min(100,Number(value)||82)),strength=visibility/100,wash=Math.max(.08,.78-strength*.7),pane=Math.max(.28,.82-strength*.54),blur=Math.max(0,(1-strength)*8);document.documentElement.style.setProperty('--background-wash',wash.toFixed(3));document.documentElement.style.setProperty('--background-pane',pane.toFixed(3));document.documentElement.style.setProperty('--background-blur',`${blur.toFixed(1)}px`);const slider=document.querySelector('#backgroundVisibility');slider.value=visibility;slider.style.setProperty('--range-progress',`${visibility}%`);document.querySelector('#backgroundVisibilityValue').value=`${Math.round(visibility)}%`;if(persist){if(native)post({type:'backgroundVisibility',value:visibility});else localStorage.setItem('pinnedNoteBackgroundVisibility',visibility)}}
    function applyAppearance(payload){calendarSync=!!payload.calendarSync;document.querySelector('#calendarSync').checked=calendarSync;setSettingsStatus('calendarStatus',calendarSync?'已开启，新建日程和计时记录会写入日历':'未开启同步',calendarSync?'ok':'');applyTheme(payload.theme);applyBackgroundVisibility(payload.backgroundVisibility??localStorage.getItem('pinnedNoteBackgroundVisibility')??82);if(payload.background){document.documentElement.style.setProperty('--custom-background',`url("${String(payload.background).replaceAll('"','%22')}")`);document.body.classList.add('has-background');setSettingsStatus('backgroundStatus','正在使用自定义背景','ok')}else{document.documentElement.style.removeProperty('--custom-background');document.body.classList.remove('has-background');setSettingsStatus('backgroundStatus','当前为默认背景')}}
    window.__PINNED_NOTE_RESULT__=(kind,ok,message)=>{if(kind==='calendar')setSettingsStatus('calendarStatus',message,ok?'ok':'error');if(kind==='background')setSettingsStatus('backgroundStatus',message,ok?'ok':'error');showToast(message)};
    function syncFocusEditor(){const f=state.focus;document.querySelector('#focusTitle').value=f.title||'';document.querySelector('#focusMode').value=f.mode||'countdown';document.querySelector('#focusMinutes').value=Math.max(1,Math.round(Number(f.duration||1500)/60));document.querySelector('#focusMinutes').disabled=f.mode==='countup'}
    window.__PINNED_NOTE_BOOTSTRAP__=payload=>{state=payload.state||state;state.tasks=Array.isArray(state.tasks)?state.tasks:[];state.events=Array.isArray(state.events)?state.events:[];state.ideas=Array.isArray(state.ideas)?state.ideas:[];state.taskTimer=state.taskTimer||{mode:'stopwatch',startedAt:0,limit:0};state.focus=state.focus||{mode:'countdown',title:'',duration:1500,elapsed:0,startedAt:0,running:false};selectedDate=new Date();monthCursor=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);applyAppearance(payload);syncFocusEditor();setView(payload.viewMode||'all',false);setDrawer(false,false);renderAll()};
    function populateTimes(){const start=document.querySelector('#startTime'),end=document.querySelector('#endTime');for(let mins=0;mins<24*60;mins+=15){const value=`${pad(Math.floor(mins/60))}:${pad(mins%60)}`;start.insertAdjacentHTML('beforeend',`<option>${value}</option>`);end.insertAdjacentHTML('beforeend',`<option>${value}</option>`)}const now=new Date(),rounded=Math.min(92,Math.ceil((now.getHours()*60+now.getMinutes())/15));start.selectedIndex=rounded;end.selectedIndex=Math.min(95,rounded+4)}populateTimes();
    document.querySelectorAll('.view-tabs button').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.querySelector('#closeDrawer').onclick=()=>setDrawer(false);document.querySelector('#drawerTab').onclick=()=>setDrawer(true);
    document.querySelector('.month-nav button:nth-child(1)').onclick=()=>{monthCursor.setMonth(monthCursor.getMonth()-1);renderCalendar()};document.querySelector('.month-nav button:nth-child(2)').onclick=()=>{selectedDate=new Date();monthCursor=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);renderAll()};document.querySelector('.month-nav button:nth-child(3)').onclick=()=>{monthCursor.setMonth(monthCursor.getMonth()+1);renderCalendar()};
    document.querySelector('#scheduleForm').onsubmit=e=>{e.preventDefault();const title=document.querySelector('#scheduleTitle').value.trim(),time=document.querySelector('#startTime').value,endTime=document.querySelector('#endTime').value;if(!title)return;if(timeToMinutes(endTime)<=timeToMinutes(time)){showToast('结束时间要晚于开始时间');return}const day=dateKey(selectedDate),event={id:uuid(),title,day,time,endTime,done:false};state.events.push(event);save();renderAll();document.querySelector('#scheduleTitle').value='';if(calendarSync){const start=parseDay(day),end=parseDay(day),[sh,sm]=time.split(':').map(Number),[eh,em]=endTime.split(':').map(Number);start.setHours(sh,sm,0,0);end.setHours(eh,em,0,0);post({type:'calendarEvent',title,start:start.getTime()/1000,end:end.getTime()/1000,source:'日程'})}showToast('日程已按时间排好')};
    document.querySelector('#todoForm').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#todoInput'),lines=input.value.split('\n').map(x=>x.replace(/^\s*(?:[-*+]\s*)?(?:\[[ xX]\]\s*)?/,'').trim()).filter(Boolean);lines.forEach(title=>state.tasks.push({id:uuid(),title,done:false,elapsed:0,createdAt:Date.now()/1000,day:dateKey(selectedDate),priority:'low'}));if(lines.length){save();renderAll();input.value='';showToast(`已添加 ${lines.length} 条待办`)}};
    document.querySelector('#ideaForm').onsubmit=e=>{e.preventDefault();const title=document.querySelector('#ideaTitle').value.trim(),notes=document.querySelector('#ideaNotes').value.trim(),raw=document.querySelector('#ideaTags').value.trim();if(!title)return;state.ideas.unshift({id:uuid(),title,notes,tags:[...new Set(raw.split(/[#,，\s]+/).filter(Boolean))],status:'灵感',createdAt:Date.now()/1000});save();renderIdeas();e.target.reset();showToast('灵感已保存')};
    document.querySelector('#focusTimer').onclick=()=>{const f=state.focus,end=Date.now()/1000;if(f.running){const delta=Math.max(0,end-f.startedAt);f.elapsed=Number(f.elapsed||0)+delta;if(calendarSync&&delta>=1)post({type:'calendarEvent',title:f.title||'番茄专注',start:f.startedAt,end,source:'番茄专注'});f.running=false;f.startedAt=0}else{f.running=true;f.startedAt=end}save();renderFocus()};
    document.querySelector('#focusTitle').onchange=e=>{state.focus.title=e.target.value.trim();save()};document.querySelector('#focusMode').onchange=e=>{state.focus.mode=e.target.value;state.focus.elapsed=0;state.focus.startedAt=0;state.focus.running=false;syncFocusEditor();save();renderFocus()};document.querySelector('#focusMinutes').onchange=e=>{state.focus.duration=Math.max(60,Math.min(14400,Number(e.target.value||25)*60));state.focus.elapsed=0;state.focus.startedAt=0;state.focus.running=false;syncFocusEditor();save();renderFocus()};document.querySelector('#resetFocus').onclick=()=>{state.focus.elapsed=0;state.focus.startedAt=0;state.focus.running=false;save();renderFocus();showToast('计时已重置')};document.querySelector('#focusToTodo').onclick=()=>{const title=document.querySelector('#focusTitle').value.trim()||'番茄专注';state.focus.title=title;state.tasks.push({id:uuid(),title,done:false,elapsed:0,createdAt:Date.now()/1000,day:dateKey(selectedDate),priority:'low'});save();renderAll();showToast('已加入待办')};
    document.querySelector('#editButton').onclick=()=>document.querySelector('#settingsPanel').classList.toggle('hidden');document.querySelector('#collapseButton').onclick=()=>post({type:'collapse'});document.querySelector('#quitButton').onclick=()=>post({type:'quit'});document.querySelector('#calendarSync').onchange=e=>{if(!native){e.target.checked=false;setSettingsStatus('calendarStatus','Apple 日历同步仅在桌面端可用','error');showToast('请在桌面端开启 Apple 日历同步');return}setSettingsStatus('calendarStatus',e.target.checked?'正在请求日历权限…':'正在关闭同步…');post({type:'calendarSync',enabled:e.target.checked})};
    const backgroundFile=document.querySelector('#backgroundFile'),backgroundVisibility=document.querySelector('#backgroundVisibility');backgroundVisibility.oninput=e=>applyBackgroundVisibility(e.target.value);backgroundVisibility.onchange=e=>{applyBackgroundVisibility(e.target.value,true);showToast(`背景可见度 ${e.target.value}%`)};document.querySelector('#chooseBackground').onclick=()=>native?post({type:'chooseBackground'}):backgroundFile.click();backgroundFile.onchange=()=>{const file=backgroundFile.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){setSettingsStatus('backgroundStatus','请选择图片文件','error');return}const reader=new FileReader();reader.onload=()=>{try{localStorage.setItem('pinnedNoteBackground',reader.result);applyAppearance({calendarSync:false,theme:localStorage.getItem('pinnedNoteTheme')||'blue',backgroundVisibility:localStorage.getItem('pinnedNoteBackgroundVisibility')||82,background:reader.result});showToast('背景图片已更新')}catch(error){setSettingsStatus('backgroundStatus','图片过大，请选择较小的图片','error')}};reader.onerror=()=>setSettingsStatus('backgroundStatus','无法读取这张图片','error');reader.readAsDataURL(file)};document.querySelector('#removeBackground').onclick=()=>{if(native){post({type:'removeBackground'});return}localStorage.removeItem('pinnedNoteBackground');applyAppearance({calendarSync:false,theme:localStorage.getItem('pinnedNoteTheme')||'blue',backgroundVisibility:localStorage.getItem('pinnedNoteBackgroundVisibility')||82,background:''});backgroundFile.value='';showToast('已恢复默认背景')};document.querySelector('#exportData').onclick=()=>post({type:'export'});document.querySelector('#importData').onclick=()=>post({type:'import'});
    document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{applyTheme(b.dataset.theme);if(native)post({type:'theme',theme:b.dataset.theme});else localStorage.setItem('pinnedNoteTheme',b.dataset.theme);showToast(`已切换为${b.textContent}样式`)});
    document.querySelectorAll('.drawer-tabs button').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.drawer-tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#ideaForm').classList.toggle('hidden',i===1)});
    const topbar=document.querySelector('.topbar');let moving=false,lastX=0,lastY=0,dragX=0,dragY=0;topbar.onpointerdown=e=>{if(e.target.closest('button,input,select,textarea'))return;moving=true;lastX=e.clientX;lastY=e.clientY;topbar.setPointerCapture(e.pointerId)};topbar.onpointermove=e=>{if(!moving)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;if(native)post({type:'move',dx,dy});else{dragX+=dx;dragY+=dy;workspace.style.transform=`translate(-50%,-50%) translate(${dragX}px,${dragY}px)`}};topbar.onpointerup=e=>{moving=false;topbar.releasePointerCapture(e.pointerId)};
    const handle=document.querySelector('#resizeHandle');let resizing=false,lastRX=0,lastRY=0;handle.onpointerdown=e=>{resizing=true;lastRX=e.clientX;lastRY=e.clientY;handle.setPointerCapture(e.pointerId);e.preventDefault()};handle.onpointermove=e=>{if(!resizing)return;const dx=e.clientX-lastRX,dy=e.clientY-lastRY;lastRX=e.clientX;lastRY=e.clientY;if(native)post({type:'resize',dw:dx,dh:dy})};handle.onpointerup=e=>{resizing=false;handle.releasePointerCapture(e.pointerId)};
    tickTimer=setInterval(()=>{renderFocus();if(state.taskTimer.activeTaskID)renderTodos()},1000);
    if(!native)window.__PINNED_NOTE_BOOTSTRAP__({viewMode:'all',calendarSync:false,theme:localStorage.getItem('pinnedNoteTheme')||'blue',backgroundVisibility:localStorage.getItem('pinnedNoteBackgroundVisibility')||82,background:localStorage.getItem('pinnedNoteBackground')||'',state:{schemaVersion:3,tasks:[],events:[],ideas:[],taskTimer:{mode:'stopwatch',startedAt:0,limit:0},focus:{mode:'countdown',title:'',duration:1500,elapsed:0,startedAt:0,running:false}}});
  </script>
</body>
</html>
